<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Enredarte] Reembolso por doble venta</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #faf7f2; margin: 0; padding: 24px; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 32px; max-width: 520px; margin: 0 auto; }
        h1 { color: #1d3a2f; font-size: 22px; margin: 0 0 12px; }
        p { color: #444; line-height: 1.6; margin: 0 0 12px; }
        .muted { color: #777; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reembolso por doble venta</h1>
        <p><strong>Obra:</strong> {{ artwork_title }}</p>
        <p><strong>Comprador:</strong> {{ buyer_email }}</p>
        <p><strong>Monto:</strong> {{ currency }} {{ amount }}</p>
        <p><strong>PaymentIntent:</strong> {{ order.stripe_payment_intent_id }}</p>
        <p><strong>Refund:</strong> {{ refund_id }}</p>
        <p class="muted">Revisar en el admin: <a href="{{ admin_url }}">{{ admin_url }}</a></p>
    </div>
</body>
</html>
