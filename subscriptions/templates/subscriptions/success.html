<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ heading }}</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #faf7f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 40px; max-width: 420px; text-align: center; }
        h1 { color: #1d3a2f; font-size: 24px; margin: 0 0 12px; }
        p { color: #555; line-height: 1.6; margin: 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ heading }}</h1>
        <p>{{ detail }}</p>
    </div>
</body>
</html>
