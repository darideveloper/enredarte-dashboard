<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block email_title %}Enredarte{% endblock %}</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: {{ brand.paper|default:"#F2EDE4" }}; margin: 0; padding: 24px; }
        .email-card { background: {{ brand.card|default:"#FFFFFF" }}; border: 1px solid {{ brand.border|default:"#E0DDD8" }}; border-radius: 0; box-shadow: none; padding: 32px; max-width: 600px; margin: 0 auto; }
        .wordmark { font-family: Georgia, "Times New Roman", serif; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: {{ brand.ink|default:"#1A1A1A" }}; margin: 0 0 8px; }
        .wordmark-rule { width: 48px; height: 2px; background: {{ brand.crimson|default:"#C41E3A" }}; margin: 0 0 24px; }
        .eyebrow { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: {{ brand.crimson|default:"#C41E3A" }}; margin: 0 0 8px; }
        h1.email-title { font-family: Georgia, "Times New Roman", serif; font-weight: 400; color: {{ brand.ink|default:"#1A1A1A" }}; font-size: 24px; line-height: 1.15; margin: 0 0 16px; }
        h2.email-subtitle { font-family: Georgia, "Times New Roman", serif; font-weight: 400; color: {{ brand.ink|default:"#1A1A1A" }}; font-size: 20px; line-height: 1.2; margin: 0 0 12px; }
        p { color: {{ brand.ink|default:"#1A1A1A" }}; font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
        .muted { color: {{ brand.muted|default:"#8A8478" }}; font-size: 13px; }
        a { color: {{ brand.crimson|default:"#C41E3A" }}; }
        hr.divider { border: 0; border-top: 1px solid {{ brand.border|default:"#E0DDD8" }}; margin: 24px 0; }
        .cta-btn { display: inline-block; background: {{ brand.crimson|default:"#C41E3A" }}; color: {{ brand.paper|default:"#F2EDE4" }}; border: 1px solid {{ brand.crimson|default:"#C41E3A" }}; border-radius: 0; padding: 15px 32px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; }
        .addr { background: {{ brand.banner_bg|default:"#EAE4D8" }}; border-radius: 0; padding: 12px 16px; white-space: pre-line; }
        .email-footer { color: {{ brand.muted|default:"#8A8478" }}; font-size: 12px; line-height: 1.7; margin: 0; }
    </style>
</head>
<body>
    <div class="email-card">
        {% include "email/_wordmark.html" %}
        <p class="eyebrow">{% block eyebrow %}{% endblock %}</p>
        <h1 class="email-title">{% block title %}{% endblock %}</h1>
        {% block body %}{% endblock %}
        {% block cta %}{% endblock %}
        {% include "email/_footer.html" %}
    </div>
</body>
</html>
