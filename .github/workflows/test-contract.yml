name: test-contract
on:
  push:
  pull_request:

jobs:
  test-contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run testing-contract guard
        run: |
          chmod +x .opencode/commands/guard.sh
          ./.opencode/commands/guard.sh

  test:
    runs-on: ubuntu-latest
    needs: test-contract-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django tests
        run: |
          python manage.py test --verbosity=2
